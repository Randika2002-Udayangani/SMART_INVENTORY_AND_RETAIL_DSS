<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Samanala Super Mart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .auth-main {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .card h2 {
            text-align: center;
            color: #2d6a4f;
            margin-bottom: 8px;
        }
        .card p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 18px;
            outline: none;
        }
        input:focus { border-color: #2d6a4f; }
        .password-hint {
            display: block;
            margin: -12px 0 16px;
            color: #667085;
            font-size: 0.82rem;
        }
        .password-input-wrap {
            position: relative;
            margin-bottom: 18px;
        }
        .password-input-wrap input {
            padding-right: 46px;
            margin-bottom: 0;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #667085;
            cursor: pointer;
            padding: 6px;
        }
        .password-toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #1b4332; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .message {
            display: none;
            font-size: 0.88rem;
            margin-bottom: 14px;
            text-align: center;
        }
        .message.success { color: #1e7e34; }
        .message.error { color: #d32f2f; }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        .register-link a { color: #2d6a4f; text-decoration: none; }
    </style>
</head>
<body>
<main class="auth-main">
    <div class="card">
        <h2>🛒 Samanala Super Mart</h2>
        <p class="subtitle">Choose a new password</p>
        <div class="message success" id="successMsg" role="status" aria-live="polite"></div>
        <div class="message error" id="errorMsg" role="alert"></div>
        <form id="resetForm" onsubmit="resetPassword(event)">
            <label for="newPassword">New Password</label>
            <div class="password-input-wrap">
                <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
                <button type="button" class="password-toggle" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility('newPassword', this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <small class="password-hint">Use at least 8 characters with a letter and a number.</small>
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-input-wrap">
                <input type="password" id="confirmPassword" placeholder="Repeat your password" minlength="8" autocomplete="new-password" required>
                <button type="button" class="password-toggle" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility('confirmPassword', this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button class="btn" id="submitBtn" type="submit">Reset password</button>
        </form>
        <div class="register-link">
            Remember your password? <a href="/customer/login/">Login here</a>
        </div>
    </div>
</main>
<script>
    const resetToken = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('submitBtn');
    const success = document.getElementById('successMsg');
    const error = document.getElementById('errorMsg');

    if (!resetToken) {
        form.style.display = 'none';
        error.textContent = 'This password reset link is invalid or incomplete. Please request a new link.';
        error.style.display = 'block';
    }

    function togglePasswordVisibility(inputId, button) {
        const input = document.getElementById(inputId);
        const showPassword = input.type === 'password';
        input.type = showPassword ? 'text' : 'password';
        const label = showPassword ? 'Hide password' : 'Show password';
        button.setAttribute('aria-label', label);
        button.title = label;
        button.innerHTML = showPassword
            ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.1-.9"/></svg>'
            : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    async function resetPassword(event) {
        event.preventDefault();
        success.style.display = 'none';
        error.style.display = 'none';
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!resetToken) {
            error.textContent = 'Please request a new password reset link.';
            error.style.display = 'block';
            return;
        }
        if (newPassword.length < 8) {
            error.textContent = 'Password must be at least 8 characters.';
            error.style.display = 'block';
            return;
        }
        if (!/[A-Za-z]/.test(newPassword) || !/\d/.test(newPassword)) {
            error.textContent = 'Password must contain at least one letter and one number.';
            error.style.display = 'block';
            return;
        }
        if (newPassword !== confirmPassword) {
            error.textContent = 'Passwords do not match.';
            error.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Resetting...';
        try {
            const res = await fetch('/api/customer-auth/reset-password/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: resetToken, new_password: newPassword })
            });
            const data = await res.json();
            if (res.ok) {
                success.textContent = data.message || 'Password has been reset. You can now log in.';
                success.style.display = 'block';
                form.style.display = 'none';
                setTimeout(() => { window.location.href = '/customer/login/'; }, 2000);
            } else {
                error.textContent = data.error || 'Unable to reset password. Please request a new link.';
                error.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Reset password';
            }
        } catch (err) {
            error.textContent = 'Connection error. Please check server is running.';
            error.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Reset password';
        }
    }
</script>
{% include "customer/footer.html" %}
</body>
</html>
