<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Samanala Super Mart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .auth-main {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .card h2 {
            text-align: center;
            color: #2d6a4f;
            margin-bottom: 8px;
        }
        .card p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 18px;
            outline: none;
        }
        input:focus { border-color: #2d6a4f; }
        .password-hint {
            display: block;
            margin: -12px 0 16px;
            color: #667085;
            font-size: 0.82rem;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #1b4332; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .message {
            display: none;
            font-size: 0.88rem;
            margin-bottom: 14px;
            text-align: center;
        }
        .message.success { color: #1e7e34; }
        .message.error { color: #d32f2f; }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        .register-link a { color: #2d6a4f; text-decoration: none; }
    </style>
</head>
<body>
<main class="auth-main">
    <div class="card">
        <h2>🛒 Samanala Super Mart</h2>
        <p class="subtitle">Choose a new password</p>
        <div class="message success" id="successMsg" role="status" aria-live="polite"></div>
        <div class="message error" id="errorMsg" role="alert"></div>
        <form id="resetForm" onsubmit="resetPassword(event)">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
            <small class="password-hint">Use a password with at least 8 characters.</small>
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" minlength="8" autocomplete="new-password" required>
            <button class="btn" id="submitBtn" type="submit">Reset password</button>
        </form>
        <div class="register-link">
            Remember your password? <a href="/customer/login/">Login here</a>
        </div>
    </div>
</main>
<script>
    const resetToken = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('submitBtn');
    const success = document.getElementById('successMsg');
    const error = document.getElementById('errorMsg');

    if (!resetToken) {
        form.style.display = 'none';
        error.textContent = 'This password reset link is invalid or incomplete. Please request a new link.';
        error.style.display = 'block';
    }

    async function resetPassword(event) {
        event.preventDefault();
        success.style.display = 'none';
        error.style.display = 'none';
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!resetToken) {
            error.textContent = 'Please request a new password reset link.';
            error.style.display = 'block';
            return;
        }
        if (newPassword.length < 8) {
            error.textContent = 'Password must be at least 8 characters.';
            error.style.display = 'block';
            return;
        }
        if (newPassword !== confirmPassword) {
            error.textContent = 'Passwords do not match.';
            error.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Resetting...';
        try {
            const res = await fetch('/api/customer-auth/reset-password/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: resetToken, new_password: newPassword })
            });
            const data = await res.json();
            if (res.ok) {
                success.textContent = data.message || 'Password has been reset. You can now log in.';
                success.style.display = 'block';
                form.style.display = 'none';
                setTimeout(() => { window.location.href = '/customer/login/'; }, 2000);
            } else {
                error.textContent = data.error || 'Unable to reset password. Please request a new link.';
                error.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Reset password';
            }
        } catch (err) {
            error.textContent = 'Connection error. Please check server is running.';
            error.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Reset password';
        }
    }
</script>
{% include "customer/footer.html" %}
</body>
</html>
