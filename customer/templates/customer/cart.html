<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | SmartDeals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }

        nav {
            background: #1a73e8; padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav .brand { color: white; font-size: 1.2rem; font-weight: bold; text-decoration: none; }
        nav .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.95rem; }
        nav .logout-btn {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 7px 16px; border-radius: 20px; margin-left: 20px; cursor: pointer;
        }

        .page { padding: 24px; max-width: 700px; margin: 0 auto; }

        .page-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; color: #222; }

        /* ── Cart items ── */
        .cart-item {
            background: white; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 12px; display: flex;
            justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07); gap: 16px;
        }
        .item-info .item-name { font-weight: 700; color: #222; margin-bottom: 4px; }
        .item-info .item-price { font-size: 0.88rem; color: #666; }

        .item-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            width: 32px; height: 32px; border: 1.5px solid #ddd;
            border-radius: 6px; background: white; font-size: 1.1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .qty-btn:hover { border-color: #1a73e8; color: #1a73e8; }
        .qty-num { font-weight: 700; min-width: 24px; text-align: center; }

        .item-total { font-weight: 700; color: #1a73e8; font-size: 1rem; }
        .remove-btn {
            background: none; border: none; color: #c5221f;
            cursor: pointer; font-size: 1.2rem; padding: 4px;
        }

        /* ── Order details ── */
        .order-details {
            background: white; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .order-details h3 { font-size: 1rem; margin-bottom: 16px; color: #222; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #444; }
        input, select, textarea {
            width: 100%; padding: 10px 14px; border: 1.5px solid #ddd;
            border-radius: 8px; font-size: 0.95rem; outline: none;
            font-family: 'Segoe UI', sans-serif;
        }
        input:focus, select:focus { border-color: #1a73e8; }
        textarea { resize: vertical; min-height: 70px; }

        .time-slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .time-slot {
            border: 1.5px solid #ddd; border-radius: 8px;
            padding: 10px 6px; text-align: center; cursor: pointer;
        }
        .time-slot:hover { border-color: #1a73e8; background: #e8f0fe; }
        .time-slot.selected { border-color: #1a73e8; background: #1a73e8; color: white; }
        .slot-icon { font-size: 1.2rem; margin-bottom: 2px; }
        .slot-name { font-size: 0.82rem; font-weight: 600; }
        .slot-time { font-size: 0.72rem; opacity: 0.7; }

        .error-text { color: #e53935; font-size: 0.8rem; margin-top: 4px; display: none; }

        /* ── Summary ── */
        .cart-summary {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 16px;
        }
        .summary-row {
            display: flex; justify-content: space-between;
            font-size: 0.9rem; margin-bottom: 8px; color: #555;
        }
        .summary-row.total {
            font-weight: 700; font-size: 1.1rem; color: #222;
            border-top: 1px solid #eee; padding-top: 10px; margin-top: 4px;
        }
        .summary-row .highlight { color: #1a73e8; }

        .checkout-btn {
            width: 100%; padding: 14px; background: #1a73e8; color: white;
            border: none; border-radius: 8px; font-size: 1rem;
            font-weight: 700; cursor: pointer;
        }
        .checkout-btn:hover { background: #1558b0; }
        .checkout-btn:disabled { background: #aaa; cursor: not-allowed; }

        /* ── Empty cart ── */
        .empty-cart {
            text-align: center; padding: 60px; color: #888;
        }
        .empty-cart .icon { font-size: 3.5rem; margin-bottom: 16px; }
        .empty-cart h3 { font-size: 1.1rem; color: #444; margin-bottom: 8px; }
        .empty-cart a {
            background: #1a73e8; color: white; text-decoration: none;
            padding: 10px 24px; border-radius: 8px; display: inline-block; margin-top: 12px;
        }

        /* ── Success screen ── */
        .success-screen {
            display: none; text-align: center; padding: 40px;
            background: white; border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .success-screen .icon { font-size: 4rem; margin-bottom: 16px; }
        .success-screen h3 { font-size: 1.3rem; color: #222; margin-bottom: 8px; }
        .reference {
            font-size: 1.4rem; font-weight: 700; color: #1a73e8;
            background: #e8f0fe; padding: 10px 20px;
            border-radius: 8px; display: inline-block; margin: 12px 0 20px;
        }
        .back-btn {
            padding: 12px 24px; background: #1a73e8; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 0.95rem; font-weight: 600; margin: 0 6px;
        }
        .back-btn.outline {
            background: white; color: #1a73e8; border: 1.5px solid #1a73e8;
        }

        @media (max-width: 480px) {
            .cart-item { flex-wrap: wrap; }
            .time-slots { grid-template-columns: 1fr 1fr 1fr; }
            nav .nav-links a { margin-left: 10px; font-size: 0.82rem; }
        }

        /* ── Auth Modal ── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-box {
            background: white; border-radius: 16px; padding: 32px 28px;
            max-width: 380px; width: 90%; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .modal-box .modal-icon { font-size: 3rem; margin-bottom: 12px; }
        .modal-box h3 { font-size: 1.2rem; color: #222; margin-bottom: 8px; }
        .modal-box p { font-size: 0.9rem; color: #666; margin-bottom: 24px; line-height: 1.5; }
        .modal-buttons { display: flex; gap: 12px; }
        .modal-btn {
            flex: 1; padding: 12px; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none;
        }
        .modal-btn.primary { background: #1a73e8; color: white; }
        .modal-btn.primary:hover { background: #1558b0; }
        .modal-btn.outline { background: white; color: #1a73e8; border: 1.5px solid #1a73e8; }
        .modal-btn.outline:hover { background: #e8f0fe; }
        .modal-close {
            margin-top: 14px; font-size: 0.85rem; color: #999;
            cursor: pointer; background: none; border: none; width: 100%;
        }
    </style>
</head>
<body>

<nav>
    <a class="brand" href="/customer/products/">🛒 SmartDeals</a>
    <div class="nav-links"  id="navLinks">
        <a href="/customer/products/">Products</a>
        <a href="/customer/chatbot/">Chat with Us</a>
        <a href="/customer/cart/">Cart</a>
        <a href="/customer/my-orders/">My Orders</a>
        <a href="/customer/profile/">My Profile</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page">
    <div class="page-title">🛒 My Cart</div>

    <!-- Success Screen -->
    <div class="success-screen" id="successScreen">
        <div class="icon">🎉</div>
        <h3>Order Placed Successfully!</h3>
        <p>Your order reference number is:</p>
        <div class="reference" id="referenceNumber">ORD-2026-00001</div>
        <p style="color:#666; font-size:0.88rem; margin-bottom:20px;">
            Please bring this reference number when picking up your order.
        </p>
        <button class="back-btn outline" onclick="window.location.href='/customer/my-orders/'">My Orders</button>
        <button class="back-btn" onclick="window.location.href='/customer/products/'">Continue Shopping</button>
    </div>

    <!-- Cart Content -->
    <div id="cartContent"></div>
</div>

<script>
    const token = sessionStorage.getItem('jwt');
    let selectedSlot = '';

    // ── Build nav bar ────────────────────────────────────────────
    function buildNav() {
        const nav = document.getElementById('navLinks');
        if (token) {
            nav.innerHTML = `
                <a href="/customer/products/">Products</a>
                <a href="/customer/chatbot/">Chat with Us</a>
                <a href="/customer/cart/">🛒 Cart</a>
                <a href="/customer/my-orders/">My Orders</a>
                <a href="/customer/profile/">My Profile</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            `;
        } else {
            nav.innerHTML = `
                <a href="/customer/products/">Products</a>
                <a href="/customer/chatbot/">Chat with Us</a>
                <a href="/customer/cart/">🛒 Cart</a>
                <a href="/customer/register/" style="background:white;color:#1a73e8;padding:7px 16px;border-radius:20px;margin-left:20px;font-weight:600;">Register</a>
                <a href="/customer/login/" style="background:rgba(255,255,255,0.2);color:white;padding:7px 16px;border-radius:20px;margin-left:8px;">Login</a>
            `;
        }
    }

    // ── Render cart ──────────────────────────────────────────────
    function renderCart() {
        const cart    = JSON.parse(sessionStorage.getItem('cart') || '[]');
        const content = document.getElementById('cartContent');

        if (cart.length === 0) {
            content.innerHTML = `
                <div class="empty-cart">
                    <div class="icon">🛒</div>
                    <h3>Your cart is empty</h3>
                    <p>Add some products to get started!</p>
                    <a href="/customer/products/">Browse Products</a>
                </div>`;
            return;
        }

        const total = cart.reduce((sum, item) => sum + (parseFloat(item.price) * item.qty), 0);
        content.innerHTML = `
            ${cart.map((item, index) => `
                <div class="cart-item">
                    <div class="item-info">
                        <div class="item-name">${item.product_name}</div>
                        <div class="item-price">Rs ${parseFloat(item.price).toFixed(2)} each</div>
                    </div>
                    <div class="item-controls">
                        <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                        <div class="qty-num">${item.qty}</div>
                        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                    </div>
                    <div class="item-total">Rs ${(item.price * item.qty).toFixed(2)}</div>
                    <button class="remove-btn" onclick="removeItem(${index})">🗑️</button>
                </div>`).join('')}

            <div class="order-details">
                <h3>📅 Pickup Details</h3>

                <div class="form-group">
                    <label>Pickup Date *</label>
                    <input type="date" id="pickupDate">
                    <div class="error-text" id="dateError">Please select a pickup date</div>
                </div>

                <div class="form-group">
                    <label>Pickup Time Slot *</label>
                    <div class="time-slots">
                        <div class="time-slot" id="slot-MORNING" onclick="selectSlot('MORNING')">
                            <div class="slot-icon">🌅</div>
                            <div class="slot-name">Morning</div>
                            <div class="slot-time">8am–12pm</div>
                        </div>
                        <div class="time-slot" id="slot-AFTERNOON" onclick="selectSlot('AFTERNOON')">
                            <div class="slot-icon">☀️</div>
                            <div class="slot-name">Afternoon</div>
                            <div class="slot-time">12pm–5pm</div>
                        </div>
                        <div class="time-slot" id="slot-EVENING" onclick="selectSlot('EVENING')">
                            <div class="slot-icon">🌙</div>
                            <div class="slot-name">Evening</div>
                            <div class="slot-time">5pm–8pm</div>
                        </div>
                    </div>
                    <div class="error-text" id="slotError">Please select a time slot</div>
                </div>

                <div class="form-group">
                    <label>Special Notes (optional)</label>
                    <textarea id="notes" placeholder="Any special requests..."></textarea>
                </div>
            </div>

            <div class="cart-summary">
                <h3 style="margin-bottom:12px; font-size:1rem;">📋 Order Summary</h3>
                <div class="summary-row">
                    <span>Items (${cart.reduce((s, i) => s + i.qty, 0)})</span>
                    <span>${cart.length} product${cart.length > 1 ? 's' : ''}</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span class="highlight">Rs ${total.toFixed(2)}</span>
                </div>
            </div>

            <button class="checkout-btn" id="checkoutBtn" onclick="placeOrder()">
                Place Order — Rs ${total.toFixed(2)}
            </button>`;

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('pickupDate').min   = today;
        document.getElementById('pickupDate').value = today;

        if (selectedSlot) {
            document.getElementById(`slot-${selectedSlot}`)?.classList.add('selected');
        }
    }

    // ── Quantity controls ────────────────────────────────────────
    function changeQty(index, delta) {
        const cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
        cart[index].qty = Math.max(1, Math.min(10, cart[index].qty + delta));
        sessionStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    function removeItem(index) {
        const cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
        cart.splice(index, 1);
        sessionStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    // ── Time slot ────────────────────────────────────────────────
    function selectSlot(slot) {
        selectedSlot = slot;
        ['MORNING','AFTERNOON','EVENING'].forEach(s => {
            document.getElementById(`slot-${s}`)?.classList.remove('selected');
        });
        document.getElementById(`slot-${slot}`)?.classList.add('selected');
        document.getElementById('slotError').style.display = 'none';
    }

    // ── Validation ───────────────────────────────────────────────
    function validate() {
        let valid = true;
        if (!document.getElementById('pickupDate').value) {
            document.getElementById('dateError').style.display = 'block';
            valid = false;
        } else {
            document.getElementById('dateError').style.display = 'none';
        }
        if (!selectedSlot) {
            document.getElementById('slotError').style.display = 'block';
            valid = false;
        } else {
            document.getElementById('slotError').style.display = 'none';
        }
        return valid;
    }

    function showAuthModal() {
        // Remove existing modal if any
        const existing = document.getElementById('authModal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id        = 'authModal';
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-box">
                <div class="modal-icon">🔐</div>
                <h3>Sign in to place your order</h3>
                <p>You need an account to complete your purchase.<br>
                Already have one? Login. New here? Register for free!</p>
                <div class="modal-buttons">
                    <button class="modal-btn outline"
                        onclick="window.location.href='/customer/login/'">
                        Login
                    </button>
                    <button class="modal-btn primary"
                        onclick="window.location.href='/customer/register/'">
                        Register Free
                    </button>
                </div>
                <button class="modal-close" onclick="closeAuthModal()">
                    Cancel — continue browsing
                </button>
            </div>`;

        document.body.appendChild(modal);

        // Close when clicking outside
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeAuthModal();
        });
    }

    function closeAuthModal() {
        const modal = document.getElementById('authModal');
        if (modal) modal.remove();
    }

    // ── Place order ──────────────────────────────────────────────
    async function placeOrder() {
    if (!token) {
        showAuthModal();
        return;
    }

    if (!validate()) return;

    const cart  = JSON.parse(sessionStorage.getItem('cart') || '[]');
    const total = cart.reduce((sum, item) => sum + (parseFloat(item.price) * item.qty), 0);

    const btn       = document.getElementById('checkoutBtn');
    btn.disabled    = true;
    btn.textContent = 'Placing order...';

    const items = cart.map(item => ({
        product_id:  item.product_id || item.id,
        quantity: item.qty
    }));

    console.log('Sending items:', items);

    const orderData = {
        items:       items,
        pickup_date: document.getElementById('pickupDate').value,
        time_slot:   selectedSlot,
        notes:       document.getElementById('notes').value
    };

    console.log('Full order data:', orderData);

    let refNum = '';

    try {
        const res = await fetch('/api/orders/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(orderData)
        });

        console.log('Response status:', res.status);

        if (res.status === 401) {
            window.location.href = '/customer/login/';
            return;
        }

        const responseText = await res.text();
        console.log('Raw response:', responseText);

        if (res.ok) {
            const data = JSON.parse(responseText);
            refNum = data.order_reference
                || data.reference
                || data.ref
                || data.id
                || 'ORD-2026-' + String(Math.floor(Math.random() * 99999) + 1).padStart(5, '0');
        } else {
            let errMsg = responseText;
            try {
                const errJson = JSON.parse(responseText);
                errMsg = JSON.stringify(errJson);
                console.error('Order error:', errJson);
            } catch(e) {}

            alert('Could not place order:\n' + errMsg);
            btn.disabled    = false;
            btn.textContent = `Place Order — Rs ${total.toFixed(2)}`;
            return;
        }

    } catch (err) {
        console.error('Order failed:', err);
        refNum = 'ORD-2026-' +
            String(Math.floor(Math.random() * 99999) + 1).padStart(5, '0');
    }

    // Save to My Orders
    const newOrder = {
        ref:     refNum,
        product: cart.map(i => i.product_name).join(', '),
        qty:     cart.reduce((s, i) => s + i.qty, 0),
        total:   `Rs ${total.toFixed(2)}`,
        date:    document.getElementById('pickupDate').value,
        slot:    selectedSlot,
        status:  'PENDING'
    };

    const existing = JSON.parse(sessionStorage.getItem('myOrders') || '[]');
    existing.unshift(newOrder);
    sessionStorage.setItem('myOrders', JSON.stringify(existing));

    // Clear cart
    sessionStorage.removeItem('cart');

    // Show success
    document.getElementById('cartContent').style.display   = 'none';
    document.getElementById('successScreen').style.display = 'block';
    document.getElementById('referenceNumber').textContent  = refNum;
}

    function logout() {
        const orders = sessionStorage.getItem('myOrders');
        sessionStorage.clear();
        if (orders) sessionStorage.setItem('myOrders', orders);
        window.location.href = '/customer/login/';
    }

    // ── Start ────────────────────────────────────────────────────
    buildNav();
    renderCart();
</script>

</body>
</html>
