{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Samanala Super Mart</title>
    <link rel="stylesheet" href="{% static 'css/logout-confirm.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }

        nav {
            background: linear-gradient(135deg, #0f3d3e 0%, #2d6a4f 100%); padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav .brand { color: white; font-size: 1.2rem; font-weight: bold; text-decoration: none; }
        nav .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.95rem; }
        nav .logout-btn {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 7px 16px; border-radius: 20px; margin-left: 20px; cursor: pointer;
        }

        .page { padding: 24px; max-width: 500px; margin: 0 auto; }

        .profile-box {
            background: white; border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1); overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #0f3d3e 0%, #2d6a4f 100%); padding: 24px;
            text-align: center; color: white;
        }
        .profile-header .avatar {
            width: 70px; height: 70px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 2rem; margin: 0 auto 12px;
        }
        .profile-header h2 { font-size: 1.2rem; }
        .profile-header p { font-size: 0.85rem; opacity: 0.85; }

        .profile-body { padding: 24px; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #444; }
        input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #ddd;
            border-radius: 8px; font-size: 0.95rem; outline: none;
        }
        input:focus { border-color: #2d6a4f; }
        input:disabled { background: #f8f9fa; color: #666; }

        .btn-row { display: flex; gap: 10px; }
        .edit-btn {
            flex: 1; padding: 12px; background: #2d6a4f; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600;
        }
        .edit-btn:hover { background: #1b4332; }
        .cancel-btn {
            flex: 1; padding: 12px; background: white; color: #666;
            border: 1.5px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 0.95rem;
        }

        .success-msg { color: #1e7e34; font-size: 0.88rem; margin-bottom: 12px; display: none; text-align: center; }
        .error-msg { color: #c5221f; font-size: 0.88rem; margin-bottom: 12px; display: none; text-align: center; }
        .password-section { border-top: 1px solid #e5e7eb; margin-top: 24px; padding-top: 22px; }
        .password-section h3 { color: #0f3d3e; font-size: 1.05rem; margin-bottom: 6px; }
        .password-section p { color: #667085; font-size: 0.86rem; margin-bottom: 16px; }
        .password-hint { display: block; margin-top: 6px; margin-bottom: 16px; color: #667085; font-size: 0.82rem; }
        .password-message { display: none; font-size: 0.88rem; margin-bottom: 12px; text-align: center; }
        .password-message.success { color: #1e7e34; }
        .password-message.error { color: #c5221f; }
        .password-btn:disabled { opacity: 0.65; cursor: wait; }

        @media (max-width: 480px) {
            nav .nav-links a { margin-left: 10px; font-size: 0.82rem; }
        }
    </style>
</head>
<body>

<nav>
    <a class="brand" href="/customer/products/">🛒 Samanala Super Mart</a>
    <div class="nav-links"  id="navLinks">
        <a href="/customer/products/">Products</a>
        <a href="/customer/chatbot/">Chat with Us</a>
        <a href="/customer/my-orders/">My Orders</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page">
    <div class="profile-box">
        <div class="profile-header">
            <div class="avatar">👤</div>
            <h2 id="headerName">My Profile</h2>
        </div>

        <div class="profile-body">
            <div class="success-msg" id="successMsg"></div>
            <div class="error-msg"   id="errorMsg"></div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" disabled>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" disabled>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" disabled>
            </div>

            <div class="btn-row">
                <button class="edit-btn" id="editBtn" onclick="toggleEdit()">Edit Profile</button>
                <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
            </div>

            <section class="password-section" aria-labelledby="changePasswordHeading">
                <h3 id="changePasswordHeading">Change Password</h3>
                <p>Choose a new password with at least 8 characters.</p>
                <div class="password-message success" id="passwordSuccessMsg" role="status"></div>
                <div class="password-message error" id="passwordErrorMsg" role="alert"></div>
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" minlength="8" autocomplete="new-password">
                    <small class="password-hint">At least 8 characters.</small>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" minlength="8" autocomplete="new-password">
                </div>
                <button class="edit-btn password-btn" id="changePasswordBtn" type="button" onclick="changePassword()">Update Password</button>
            </section>
        </div>
    </div>
</div>

<script>
    const token = sessionStorage.getItem('jwt');
    if (!token) window.location.href = '/customer/login/';
    let isEditing = false;
    let original  = {};

    if (!token) window.location.href = '/customer/login/';

    function formatCustomerName(name) {
        return (name || '').trim().split(/\s+/).filter(Boolean)
            .map(part => part.charAt(0).toLocaleUpperCase() + part.slice(1).toLocaleLowerCase())
            .join(' ');
    }

    // ── Dynamic nav bar ──────────────────────────────────────────
    function buildNav() {
        const token = sessionStorage.getItem('jwt');
        const nav   = document.getElementById('navLinks');

        if (token) {
            // Logged in nav
            nav.innerHTML = `
                <a href="/customer/products/">Products</a>
                <a href="/customer/chatbot/">Chat with Us</a>
                <a href="/customer/cart/">🛒 Cart <span id="cartBadge" style="background:red;color:white;border-radius:50%;padding:1px 6px;font-size:0.75rem;display:none;">0</span></a>
                <a href="/customer/my-orders/">My Orders</a>
                <a href="/customer/profile/">My Profile</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            `;
        } else {
            // Guest nav
            nav.innerHTML = `
                <a href="/customer/products/">Products</a>
                <a href="/customer/chatbot/">Chat with Us</a>
                <a href="/customer/cart/">🛒 Cart <span id="cartBadge" style="background:red;color:white;border-radius:50%;padding:1px 6px;font-size:0.75rem;display:none;">0</span></a>
                <a href="/customer/register/" style="background:white;color:#2d6a4f;padding:7px 16px;border-radius:20px;margin-left:20px;font-weight:600;">Register</a>
                <a href="/customer/login/" style="background:rgba(255,255,255,0.2);color:white;padding:7px 16px;border-radius:20px;margin-left:8px;">Login</a>
            `;
        }
        updateCartBadge();
    }

    // ── Load profile ─────────────────────────────────────────────
    async function loadProfile() {
        try {
            const res = await fetch('/api/customer-auth/profile/', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (res.ok) {
                const data = await res.json();
                const displayName = formatCustomerName(data.name);
                original = { ...data, name: displayName };

                document.getElementById('name').value           = displayName;
                document.getElementById('email').value          = data.email          || '';
                document.getElementById('phone').value          = data.contact_number || '';

                document.getElementById('headerName').textContent = displayName || 'Customer';
            }
        } catch (err) {
            console.error('Profile load error:', err);
        }
    }

    // ── Toggle edit mode ─────────────────────────────────────────
    function toggleEdit() {
        if (!isEditing) {
            document.getElementById('name').disabled  = false;
            document.getElementById('phone').disabled = false;
            document.getElementById('email').disabled = false;
            document.getElementById('editBtn').textContent = 'Save Changes';
            document.getElementById('cancelBtn').style.display = 'block';
            isEditing = true;
        } else {
            saveProfile();
        }
    }

   function cancelEdit() {
        // Use current field values — not original
        // (saveProfile already updated original before calling this)
        document.getElementById('name').disabled  = true;
        document.getElementById('email').disabled = true;
        document.getElementById('phone').disabled = true;
        document.getElementById('editBtn').textContent = 'Edit Profile';
        document.getElementById('cancelBtn').style.display = 'none';
        isEditing = false;
    }
    
    // ── Save profile ─────────────────────────────────────────────
    async function saveProfile() {
        const name           = document.getElementById('name').value.trim();
        const email          = document.getElementById('email').value.trim();
        const contact_number = document.getElementById('phone').value.trim();

        try {
            const res = await fetch('/api/customer-auth/profile/', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ name, email, contact_number })
            });

            if (res.ok) {
                const data = await res.json();
                original = data;

                document.getElementById('name').value  = data.name           || name;
                document.getElementById('email').value = data.email          || email;
                document.getElementById('phone').value = data.contact_number || contact_number;

                const displayName = formatCustomerName(data.name || name);
                document.getElementById('name').value = displayName;
                document.getElementById('headerName').textContent = displayName;

                sessionStorage.setItem('customerName', displayName);

                showSuccess('Profile updated successfully!');
                cancelEdit();
            } else {
                const err = await res.json();
                showError(err.error || err.detail || 'Update failed.');
            }
        } catch (err) {
            showError('Connection error. Please try again.');
        }
    }

    function showSuccess(msg) {
        const el = document.getElementById('successMsg');
        el.textContent = msg; el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }
    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg; el.style.display = 'block';
    }

    function showPasswordMessage(type, message) {
        const success = document.getElementById('passwordSuccessMsg');
        const error = document.getElementById('passwordErrorMsg');
        success.style.display = 'none';
        error.style.display = 'none';
        const target = type === 'success' ? success : error;
        target.textContent = message;
        target.style.display = 'block';
    }

    async function changePassword() {
        const oldPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmNewPassword').value;
        const button = document.getElementById('changePasswordBtn');

        document.getElementById('passwordSuccessMsg').style.display = 'none';
        document.getElementById('passwordErrorMsg').style.display = 'none';
        if (!oldPassword || !newPassword || !confirmPassword) {
            showPasswordMessage('error', 'Please complete all password fields.');
            return;
        }
        if (newPassword.length < 8) {
            showPasswordMessage('error', 'Your new password must be at least 8 characters.');
            return;
        }
        if (newPassword !== confirmPassword) {
            showPasswordMessage('error', 'The new passwords do not match.');
            return;
        }

        button.disabled = true;
        button.textContent = 'Updating...';
        try {
            const res = await fetch('/api/customer-auth/change-password/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ old_password: oldPassword, new_password: newPassword })
            });
            const data = await res.json();
            if (!res.ok) {
                showPasswordMessage('error', data.error || data.detail || 'Password update failed. Please try again.');
                return;
            }
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmNewPassword').value = '';
            showPasswordMessage('success', data.message || 'Password changed successfully.');
        } catch (err) {
            showPasswordMessage('error', 'Connection error. Please try again.');
        } finally {
            button.disabled = false;
            button.textContent = 'Update Password';
        }
    }

    function logout() { showLogoutConfirmation(); }

    loadProfile();
</script>
<script src="{% static 'js/logout-confirm.js' %}"></script>
</body>
</html>
