<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Samanala Super Mart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .auth-main {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .card h2 {
            text-align: center;
            color: #2d6a4f;
            margin-bottom: 8px;
        }
        .card p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 18px;
            outline: none;
        }
        input:focus { border-color: #2d6a4f; }
        .btn {
            width: 100%;
            padding: 12px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #1b4332; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .message {
            display: none;
            font-size: 0.88rem;
            margin-bottom: 14px;
            text-align: center;
        }
        .message.success { color: #1e7e34; }
        .message.error { color: #d32f2f; }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        .register-link a { color: #2d6a4f; text-decoration: none; }
    </style>
</head>
<body>
<main class="auth-main">
    <div class="card">
        <h2>🛒 Samanala Super Mart</h2>
        <p class="subtitle">Reset your password</p>
        <div class="message success" id="successMsg" role="status" aria-live="polite"></div>
        <div class="message error" id="errorMsg" role="alert"></div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required>
        <button class="btn" id="submitBtn" type="button" onclick="requestReset()">Send reset link</button>
        <div class="register-link">
            Remember your password? <a href="/customer/login/">Login here</a>
        </div>
    </div>
</main>
<script>
    async function requestReset() {
        const email = document.getElementById('email').value.trim();
        const btn = document.getElementById('submitBtn');
        const success = document.getElementById('successMsg');
        const error = document.getElementById('errorMsg');
        success.style.display = 'none';
        error.style.display = 'none';

        if (!email) {
            error.textContent = 'Please enter your email address.';
            error.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Sending...';
        try {
            const res = await fetch('/api/customer-auth/forgot-password/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (res.ok) {
                success.textContent = data.message || 'If that email is registered, a password reset link has been sent.';
                success.style.display = 'block';
                let remaining = 30;
                btn.textContent = 'Try again in ' + remaining + 's';
                const countdown = setInterval(() => {
                    remaining -= 1;
                    if (remaining <= 0) {
                        clearInterval(countdown);
                        btn.disabled = false;
                        btn.textContent = 'Send reset link';
                    } else {
                        btn.textContent = 'Try again in ' + remaining + 's';
                    }
                }, 1000);
            } else {
                error.textContent = data.error || 'Unable to process your request. Please try again.';
                error.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Send reset link';
            }
        } catch (err) {
            error.textContent = 'Connection error. Please check server is running.';
            error.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Send reset link';
        }
    }
</script>
{% include "customer/footer.html" %}
</body>
</html>
