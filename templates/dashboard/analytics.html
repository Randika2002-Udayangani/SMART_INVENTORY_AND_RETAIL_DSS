<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics — Smart Inventory DSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { background:#f0f4f8; font-family:'Segoe UI',sans-serif; }
        .page-header { background:white; padding:20px 30px; border-bottom:1px solid #e2e8f0; margin-bottom:24px; }
        .btn-primary { background:#2d6a4f; border:none; }
        .card { border-radius:12px; border:1px solid #e2e8f0; }
        .kpi-card { background:white; border-radius:12px; padding:20px; border:1px solid #e2e8f0; text-align:center; }
        .kpi-val { font-size:24px; font-weight:700; color:#1a2e1e; }
        .kpi-lbl { font-size:11px; color:#64748b; text-transform:uppercase; }
    </style>
</head>
<body>
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-0 fw-bold">Sales & Profit Analytics</h4>
        <small class="text-muted">Samanala Super Mart — Decision Support System</small>
    </div>
    <div>
        <a href="/dashboard/" class="btn btn-outline-secondary btn-sm me-2">← Dashboard</a>
        <button onclick="doLogout()" class="btn btn-sm" style="background:#ef4444;color:white;">Logout</button>
    </div>
</div>

<div class="container-fluid px-4">

    <!-- Date Filter -->
    <div class="card p-3 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">From Date</label>
                <input type="date" id="dateFrom" class="form-control" value="2026-01-01">
            </div>
            <div class="col-md-4">
                <label class="form-label">To Date</label>
                <input type="date" id="dateTo" class="form-control" value="2026-06-30">
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="loadAll()">Apply Filter</button>
            </div>
        </div>
    </div>

    <!-- KPI Summary -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="kpi-card">
                <div class="kpi-lbl">Total Revenue</div>
                <div class="kpi-val text-success" id="totalRevenue">—</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="kpi-card">
                <div class="kpi-lbl">Total Cost</div>
                <div class="kpi-val text-danger" id="totalCost">—</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="kpi-card">
                <div class="kpi-lbl">Total Profit</div>
                <div class="kpi-val text-primary" id="totalProfit">—</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="kpi-card">
                <div class="kpi-lbl">Profit Margin</div>
                <div class="kpi-val" id="margin">—</div>
            </div>
        </div>
    </div>

    <!-- Charts -->
    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card p-4">
                <h6 class="fw-bold mb-3">Top 5 Products by Profit</h6>
                <canvas id="profitChart" height="200"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4">
                <h6 class="fw-bold mb-3">Sales Trend</h6>
                <canvas id="trendChart" height="200"></canvas>
            </div>
        </div>
    </div>

    <!-- Top Products Table -->
    <div class="card p-4">
        <h6 class="fw-bold mb-3">Product Performance</h6>
        <table class="table table-hover">
            <thead class="table-light">
                <tr><th>Product</th><th>Units Sold</th><th>Revenue</th><th>Profit</th><th>Margin %</th></tr>
            </thead>
            <tbody id="analyticsBody">
                <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const token = sessionStorage.getItem('access_token');
if (!token) { window.location.href = '/dashboard/login/'; }

function doLogout() {
    sessionStorage.removeItem('access_token');
    sessionStorage.removeItem('refresh_token');
    window.location.href = '/dashboard/login/';
}

let profitChart, trendChart;

async function loadAll() {
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;

    // Load profit summary (KPI cards only — this endpoint has no product breakdown yet)
    try {
        const res = await fetch(`/api/analytics/profit-summary/?date_from=${dateFrom}&date_to=${dateTo}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        document.getElementById('totalRevenue').innerText = 'Rs ' + Number(data.total_revenue ?? 0).toLocaleString();
        document.getElementById('totalCost').innerText = 'Rs ' + Number(data.total_cost ?? 0).toLocaleString();
        document.getElementById('totalProfit').innerText = 'Rs ' + Number(data.total_profit ?? 0).toLocaleString();
        document.getElementById('margin').innerText = (data.overall_margin_percent ?? data.profit_margin_pct ?? 0).toFixed(1) + '%';

        // Product-level breakdown endpoint not available yet on the backend — show placeholder
        document.getElementById('analyticsBody').innerHTML =
            '<tr><td colspan="5" class="text-center text-muted">Product-level breakdown not available yet — backend endpoint pending.</td></tr>';

        if (profitChart) profitChart.destroy();
    } catch(e) {
        document.getElementById('analyticsBody').innerHTML = '<tr><td colspan="5" class="text-center text-muted">Could not load data.</td></tr>';
    }
    // Load sales trend (endpoint not built yet on backend — show empty chart, don't break the page)
    try {
        const tRes = await fetch(`/api/analytics/sales-trend/?period=monthly&months=6`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!tRes.ok) throw new Error('sales-trend endpoint not available');
        const tData = await tRes.json();
        const labels = tData.map ? tData.map(d => d.period ?? d.label) : [];
        const values = tData.map ? tData.map(d => d.revenue ?? d.total_sales_revenue ?? 0) : [];

        if (trendChart) trendChart.destroy();
        trendChart = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: labels.length > 0 ? labels : ['Jan','Feb','Mar','Apr','May','Jun'],
                datasets: [{ label: 'Revenue (Rs)', data: values.length > 0 ? values : [0,0,0,0,0,0], borderColor: '#2d6a4f', tension: 0.4, fill: false }]
            },
            options: { responsive: true }
        });
    } catch(e) {
        // Sales trend endpoint not available yet — silently skip chart, KPI cards above still work fine
    }// Load sales trend (endpoint not built yet on backend — show empty chart, don't break the page)
    try {
        const tRes = await fetch(`/api/analytics/sales-trend/?period=monthly&months=6`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!tRes.ok) throw new Error('sales-trend endpoint not available');
        const tData = await tRes.json();
        const labels = tData.map ? tData.map(d => d.period ?? d.label) : [];
        const values = tData.map ? tData.map(d => d.revenue ?? d.total_sales_revenue ?? 0) : [];

        if (trendChart) trendChart.destroy();
        trendChart = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: labels.length > 0 ? labels : ['Jan','Feb','Mar','Apr','May','Jun'],
                datasets: [{ label: 'Revenue (Rs)', data: values.length > 0 ? values : [0,0,0,0,0,0], borderColor: '#2d6a4f', tension: 0.4, fill: false }]
            },
            options: { responsive: true }
        });
    } catch(e) {
        // Sales trend endpoint not available yet — silently skip chart, KPI cards above still work fine
    }
}

loadAll();
</script>
</body>
</html>
