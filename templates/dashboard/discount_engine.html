<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Engine — Smart Inventory DSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f0f4f8; font-family:'Segoe UI',sans-serif; }
        .page-header { background:white; padding:20px 30px; border-bottom:1px solid #e2e8f0; margin-bottom:24px; }
        .btn-primary { background:#2d6a4f; border:none; }
        .badge-pending { background:#fef9c3; color:#854d0e; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
        .badge-applied { background:#dcfce7; color:#16a34a; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
        .badge-ignored { background:#f3f4f6; color:#374151; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
    </style>
</head>
<body>
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-0 fw-bold">Discount Engine</h4>
        <small class="text-muted">Near-expiry discount recommendations · Samanala Super Mart</small>
    </div>
    <div>
        <button class="btn btn-primary btn-sm me-2" id="calcBtn" onclick="runCalculate()">▶ Calculate Discounts</button>
        <a href="/dashboard/" class="btn btn-outline-secondary btn-sm me-2">← Dashboard</a>
        <button onclick="doLogout()" class="btn btn-sm" style="background:#ef4444;color:white;">Logout</button>
    </div>
</div>

<div class="container-fluid px-4">
    <div class="card p-4">
        <h6 class="fw-bold mb-3">Discount Recommendations</h6>
        <table class="table table-hover">
            <thead class="table-light">
                <tr><th>Product</th><th>Batch</th><th>Days to Expiry</th><th>Suggested Discount</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="discountBody">
                <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const token = sessionStorage.getItem('access_token');
if (!token) { window.location.href = '/dashboard/login/'; }

function doLogout() {
    sessionStorage.removeItem('access_token');
    sessionStorage.removeItem('refresh_token');
    window.location.href = '/dashboard/login/';
}

function statusBadge(s) {
    const map = { 'PENDING':'badge-pending', 'APPLIED':'badge-applied', 'IGNORED':'badge-ignored' };
    return `<span class="${map[s] || 'badge-pending'}">${s}</span>`;
}

async function loadDiscounts() {
    try {
        const res = await fetch('/api/discounts/recommendations/', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        const rows = Array.isArray(data) ? data : (data.results ?? []);
        const tbody = document.getElementById('discountBody');
        if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No discount recommendations. Click Calculate Discounts.</td></tr>';
            return;
        }
        tbody.innerHTML = rows.map(r => `
            <tr>
                <td>${r.product_name ?? '—'}</td>
                <td>${r.batch_id ?? '—'}</td>
                <td>${r.days_to_expiry ?? '—'}</td>
                <td><strong>${r.suggested_discount_pct ?? '—'}%</strong></td>
                <td>${statusBadge(r.status)}</td>
                <td>
                    <button class="btn btn-sm btn-success me-1" onclick="updateStatus(${r.id},'APPLIED')">Apply</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="updateStatus(${r.id},'IGNORED')">Ignore</button>
                </td>
            </tr>
        `).join('');
    } catch(e) {
        document.getElementById('discountBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted">Could not load data.</td></tr>';
    }
}

async function updateStatus(id, status) {
    try {
        await fetch(`/api/discounts/recommendations/${id}/`, {
            method: 'PATCH',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        loadDiscounts();
    } catch(e) {}
}

async function runCalculate() {
    const btn = document.getElementById('calcBtn');
    btn.innerHTML = '⏳ Calculating...';
    btn.disabled = true;
    try {
        await fetch('/api/discounts/calculate/', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        await loadDiscounts();
    } catch(e) {}
    btn.innerHTML = '▶ Calculate Discounts';
    btn.disabled = false;
}

loadDiscounts();
</script>
</body>
</html>
