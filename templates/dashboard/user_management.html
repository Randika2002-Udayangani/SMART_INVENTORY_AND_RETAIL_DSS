<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Management - Smart Inventory DSS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f0f4f8;color:#1a2e1e;font-family:'Segoe UI',sans-serif}.page-header{background:#0f3d3e;color:#fff;padding:20px 30px}.card{border:1px solid #d8e4dc;border-radius:10px}.muted{color:#64748b}.table{font-size:13px}</style>
</head>
<body>
<header class="page-header d-flex justify-content-between align-items-center"><div><h4 class="mb-1">User Management</h4><small>Staff accounts, roles, status, and lockout recovery</small></div><div><a href="/dashboard/" class="btn btn-light btn-sm me-2">Dashboard</a><button onclick="logout()" class="btn btn-danger btn-sm">Logout</button></div></header>
<main class="container-fluid p-4"><div id="message" class="alert d-none"></div><div class="card bg-white p-4 mb-4"><h5>Add staff user</h5><div class="row g-2"><div class="col-md-3"><input id="newUsername" class="form-control" placeholder="Username"></div><div class="col-md-3"><input id="newPassword" type="password" class="form-control" placeholder="Password"></div><div class="col-md-3"><select id="newRole" class="form-select"><option>STAFF</option><option>MANAGER</option><option>ADMIN</option></select></div><div class="col-md-3"><button class="btn btn-primary w-100" onclick="createUser()">Create user</button></div></div></div><div class="card bg-white p-4"><div class="d-flex justify-content-between mb-3"><h5 class="mb-0">Staff accounts</h5><button class="btn btn-outline-secondary btn-sm" onclick="refreshUsers()">Refresh</button></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="userBody"><tr><td colspan="6" class="text-center muted">Loading...</td></tr></tbody></table></div></div></main>
<script>
const token=sessionStorage.getItem('access_token');if(!token)location.href='/dashboard/login/';
function logout(){sessionStorage.clear();location.href='/dashboard/login/';}
function message(text,type='success'){const e=document.getElementById('message');e.className='alert alert-'+type;e.textContent=text;}
async function api(url,options={}){const h=new Headers(options.headers||{});h.set('Authorization','Bearer '+token);const r=await fetch(url,{...options,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
async function loadUsers(){try{const rows=await api('/api/users/');userBody.innerHTML=rows.length?rows.map(u=>{
  let statusHtml;
  if(!u.is_active){
    statusHtml='<span class="text-danger">Inactive</span>';
  }else if(u.is_locked){
    const until=u.locked_until?new Date(u.locked_until).toLocaleTimeString():'';
    statusHtml=`<span class="text-danger fw-semibold">🔒 Locked</span>${until?`<br><small class="muted">until ${until}</small>`:''}`;
  }else{
    statusHtml='<span class="text-success">Active</span>';
    if(u.failed_login_count>0){
      statusHtml+=`<br><small class="muted">${u.failed_login_count} failed attempt${u.failed_login_count===1?'':'s'}</small>`;
    }
  }
  const showUnlock=u.is_locked||u.failed_login_count>0;
  return `<tr><td>${u.id}</td><td>${escapeHtml(u.username)}</td><td><span class="badge text-bg-secondary">${escapeHtml(u.role)}</span></td><td>${statusHtml}</td><td>${u.date_joined?new Date(u.date_joined).toLocaleDateString():'-'}</td><td class="d-flex flex-wrap gap-1"><button class="btn btn-outline-secondary btn-sm" onclick="toggleUser(${u.id},${u.is_active})">${u.is_active?'Deactivate':'Activate'}</button>${showUnlock?`<button class="btn btn-outline-warning btn-sm" onclick="unlock(${u.id})">Unlock</button>`:''}<button class="btn btn-outline-primary btn-sm" onclick="resetPassword(${u.id},'${escapeHtml(u.username)}')">Reset password</button></td></tr>`;
}).join(''):'<tr><td colspan="6" class="text-center muted">No users found.</td></tr>';}catch(e){userBody.innerHTML='<tr><td colspan="6" class="text-center text-danger">'+escapeHtml(e.message)+'</td></tr>';}}
async function refreshUsers(){const btn=event.currentTarget;const original=btn.textContent;btn.disabled=true;btn.textContent='Refreshing...';await loadUsers();btn.textContent='Refreshed ✓';setTimeout(()=>{btn.textContent=original;btn.disabled=false;},900);}
async function resetPassword(id,username){const pw=prompt('New password for '+username+' (min 6 characters):');if(pw===null)return;if(pw.trim().length<6){message('Password must be at least 6 characters.','danger');return;}try{await api('/api/users/'+id+'/',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.trim()})});message('Password reset for '+username+'.');loadUsers();}catch(e){message(e.message,'danger');}}
async function createUser(){try{await api('/api/users/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:newUsername.value,password:newPassword.value,role:newRole.value})});message('User created.');newUsername.value='';newPassword.value='';loadUsers();}catch(e){message(e.message,'danger');}}
async function toggleUser(id,isActive){try{await api('/api/users/'+id+'/',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:!isActive})});loadUsers();}catch(e){message(e.message,'danger');}}
async function unlock(id){try{await api('/api/users/'+id+'/unlock/',{method:'POST'});message('Account unlocked.');loadUsers();}catch(e){message(e.message,'danger');}}
function escapeHtml(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}loadUsers();
</script></body></html>
