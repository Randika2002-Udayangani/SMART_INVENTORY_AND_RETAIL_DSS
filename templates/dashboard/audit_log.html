<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Log - Smart Inventory DSS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f0f4f8;color:#1a2e1e;font-family:'Segoe UI',sans-serif}.page-header{background:#0f3d3e;color:#fff;padding:20px 30px}.card{border:1px solid #d8e4dc;border-radius:10px}.muted{color:#64748b}.table{font-size:13px}</style>
</head>
<body>
<header class="page-header d-flex justify-content-between align-items-center"><div><h4 class="mb-1">Audit Log</h4><small>Administrative activity history</small></div><div><a href="/dashboard/" class="btn btn-light btn-sm me-2">Dashboard</a><button onclick="logout()" class="btn btn-danger btn-sm">Logout</button></div></header>
<main class="container-fluid p-4"><div id="message" class="alert d-none"></div><div class="card bg-white p-4"><div class="row g-2 mb-3"><div class="col-md-3"><input id="user" class="form-control" placeholder="User ID"></div><div class="col-md-3"><input id="table" class="form-control" placeholder="Table name"></div><div class="col-md-3"><input id="action" class="form-control" placeholder="Action"></div><div class="col-md-3"><button class="btn btn-primary w-100" onclick="loadLogs()">Apply filters</button></div></div><div class="d-flex justify-content-between align-items-center mb-2"><small class="muted" id="lastUpdated"></small><button class="btn btn-outline-secondary btn-sm" onclick="refreshLogs()">Refresh</button></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Table</th><th>Record</th><th>IP address</th><th></th></tr></thead><tbody id="logBody"><tr><td colspan="7" class="text-center muted">Loading...</td></tr></tbody></table></div></div></main>
<script>
const token=sessionStorage.getItem('access_token'); if(!token) location.href='/dashboard/login/';
function logout(){sessionStorage.clear();location.href='/dashboard/login/';}
async function api(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
async function loadLogs(){try{const params=new URLSearchParams();if(user.value)params.set('user',user.value);if(table.value)params.set('table_name',table.value);if(action.value)params.set('action',action.value);const rows=await api('/api/audit-log/?'+params);logBody.innerHTML=rows.length?rows.map(l=>`<tr><td>${l.timestamp?new Date(l.timestamp).toLocaleString():'-'}</td><td>${escapeHtml(l.username||'Unknown')} <span class="muted">#${l.user_id||'-'}</span></td><td><span class="badge text-bg-secondary">${escapeHtml(l.action)}</span></td><td>${escapeHtml(l.table_name)}</td><td>${l.record_id??'-'}</td><td>${escapeHtml(l.ip_address||'-')}</td><td><button class="btn btn-outline-secondary btn-sm" onclick="details(${l.id})">Details</button></td></tr>`).join(''):'<tr><td colspan="7" class="text-center muted">No audit records found.</td></tr>';document.getElementById('lastUpdated').textContent='Last updated '+new Date().toLocaleTimeString();}catch(e){logBody.innerHTML='<tr><td colspan="7" class="text-center text-danger">'+escapeHtml(e.message)+'</td></tr>';}}
async function refreshLogs(){const btn=event.currentTarget;const original=btn.textContent;btn.disabled=true;btn.textContent='Refreshing...';await loadLogs();btn.textContent='Refreshed ✓';setTimeout(()=>{btn.textContent=original;btn.disabled=false;},900);}
setInterval(loadLogs,30000);
async function details(id){try{const d=await api('/api/audit-log/'+id+'/');alert(JSON.stringify(d,null,2));}catch(e){alert(e.message);}}
function escapeHtml(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}loadLogs();
</script></body></html>
