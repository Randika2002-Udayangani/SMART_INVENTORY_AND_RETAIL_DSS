<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reorder — Smart Inventory DSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f0f4f8; font-family:'Segoe UI',sans-serif; }
        .page-header { background:white; padding:20px 30px; border-bottom:1px solid #e2e8f0; margin-bottom:24px; }
        .btn-primary { background:#2d6a4f; border:none; }
        .badge-critical { background:#fee2e2; color:#dc2626; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
        .badge-high { background:#fed7aa; color:#c2410c; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
        .badge-medium { background:#fef9c3; color:#854d0e; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
        .badge-low { background:#dcfce7; color:#16a34a; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
    </style>
</head>
<body>
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-0 fw-bold">Reorder Recommendations</h4>
        <small class="text-muted">Samanala Super Mart — Decision Support System</small>
    </div>
    <div>
        <button class="btn btn-primary btn-sm me-2" id="calcBtn" onclick="runCalculate()">▶ Calculate Reorder</button>
        <a href="/dashboard/" class="btn btn-outline-secondary btn-sm me-2">← Dashboard</a>
        <button onclick="doLogout()" class="btn btn-sm" style="background:#ef4444;color:white;">Logout</button>
    </div>
</div>

<div class="container-fluid px-4">
    <!-- Filter -->
    <div class="mb-3 d-flex gap-2">
        <select id="urgencyFilter" class="form-select form-select-sm" style="width:160px;" onchange="loadRecommendations()">
            <option value="">All Urgency</option>
            <option value="CRITICAL">CRITICAL</option>
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="LOW">LOW</option>
        </select>
        <select id="statusFilter" class="form-select form-select-sm" style="width:160px;" onchange="loadRecommendations()">
            <option value="">All Status</option>
            <option value="PENDING">PENDING</option>
            <option value="ORDERED">ORDERED</option>
            <option value="IGNORED">IGNORED</option>
        </select>
    </div>

    <div class="card p-4">
        <table class="table table-hover">
            <thead class="table-light">
                <tr><th>Product</th><th>Current Stock</th><th>Reorder Point</th><th>Suggested Qty</th><th>Urgency</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="reorderBody">
                <tr><td colspan="7" class="text-center text-muted">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const token = sessionStorage.getItem('access_token');
if (!token) { window.location.href = '/dashboard/login/'; }
if (!token) { window.location.href = '/dashboard/login/'; }

function doLogout() {
    sessionStorage.removeItem('access_token');
    sessionStorage.removeItem('refresh_token');
    window.location.href = '/dashboard/login/';
}

function urgencyBadge(u) {
    const map = { 'CRITICAL':'badge-critical', 'HIGH':'badge-high', 'MEDIUM':'badge-medium', 'LOW':'badge-low' };
    return `<span class="${map[u] || 'badge-low'}">${u}</span>`;
}

async function loadRecommendations() {
    const urgency = document.getElementById('urgencyFilter').value;
    const status = document.getElementById('statusFilter').value;
    let url = '/api/reorder/recommendations/?';
    if (urgency) url += `urgency=${urgency}&`;
    if (status) url += `status=${status}`;

    try {
        const res = await fetch(url, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        const rows = Array.isArray(data) ? data : (data.results ?? []);
        const tbody = document.getElementById('reorderBody');
        if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No recommendations found. Click Calculate Reorder.</td></tr>';
            return;
        }
        tbody.innerHTML = rows.map(r => `
            <tr>
                <td>${r.product_name ?? '—'}</td>
                <td>${r.current_stock ?? '—'}</td>
                <td>${r.safety_stock ?? '—'}</td>
                <td>${r.suggested_quantity ?? '—'}</td>
                <td>${urgencyBadge(r.urgency)}</td>
                <td><span class="badge bg-secondary">${r.status ?? '—'}</span></td>
                <td>
                    <button class="btn btn-sm btn-success me-1" onclick="updateStatus(${r.id},'ORDERED')">Ordered</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="updateStatus(${r.id},'IGNORED')">Ignore</button>
                </td>
            </tr>
        `).join('');
    } catch(e) {
        document.getElementById('reorderBody').innerHTML = '<tr><td colspan="7" class="text-center text-muted">Could not load data.</td></tr>';
    }
}

async function updateStatus(id, status) {
    try {
        await fetch(`/api/reorder/recommendations/${id}/`, {
            method: 'PATCH',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        loadRecommendations();
    } catch(e) {}
}

async function runCalculate() {
    const btn = document.getElementById('calcBtn');
    btn.innerHTML = '⏳ Calculating...';
    btn.disabled = true;
    try {
        await fetch('/api/reorder/calculate/', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        await loadRecommendations();
    } catch(e) {}
    btn.innerHTML = '▶ Calculate Reorder';
    btn.disabled = false;
}

loadRecommendations();
</script>
</body>
</html>
