<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report — Smart Inventory DSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .page-header { background:white; padding:20px 30px; border-bottom:1px solid #e2e8f0; margin-bottom:24px; }
        .card { border-radius:12px; border:1px solid #e2e8f0; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .btn-primary { background:#2d6a4f; border:none; }
        .btn-primary:hover { background:#1b4332; }
        .summary-val { font-size:28px; font-weight:700; color:#1a2e1e; }
        .summary-lbl { font-size:12px; color:#64748b; text-transform:uppercase; letter-spacing:0.05em; }
        .error-msg { color:red; font-size:13px; display:none; }
    </style>
</head>
<body>

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-0 fw-700">Sales Report</h4>
        <small class="text-muted">Samanala Super Mart — Decision Support System</small>
    </div>
    <div>
        <a href="/dashboard/" class="btn btn-outline-secondary btn-sm me-2">← Dashboard</a>
        <button onclick="doLogout()" class="btn btn-sm" style="background:#ef4444;color:white;">Logout</button>
    </div>
</div>

<div class="container-fluid px-4">

    <!-- Date Filter -->
    <div class="card p-4 mb-4">
        <h6 class="fw-bold mb-3">Select Date Range</h6>
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">From Date</label>
                <input type="date" id="dateFrom" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">To Date</label>
                <input type="date" id="dateTo" class="form-control">
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="loadReport()">Generate Report</button>
            </div>
        </div>
        <div class="error-msg mt-2" id="errorMsg">Please select both From Date and To Date.</div>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4" id="summarySection" style="display:none!important;">
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="summary-lbl">Total Units Sold</div>
                <div class="summary-val" id="totalUnits">—</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="summary-lbl">Total Sales Revenue</div>
                <div class="summary-val" id="totalRevenue">—</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="summary-lbl">Best Selling Product</div>
                <div class="summary-val" style="font-size:16px;" id="bestProduct">—</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="summary-lbl">Worst Selling Product</div>
                <div class="summary-val" style="font-size:16px;" id="worstProduct">—</div>
            </div>
        </div>
    </div>

    <!-- Top 5 Products Table -->
    <div class="card p-4" id="tableSection" style="display:none;">
        <h6 class="fw-bold mb-3">Top 5 Products</h6>
        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Product Name</th>
                    <th>Units Sold</th>
                    <th>Revenue (Rs)</th>
                </tr>
            </thead>
            <tbody id="topProductsBody">
            </tbody>
        </table>
    </div>

</div>

<script>
// Auth check
const token = localStorage.getItem('access_token');
if (!token) { window.location.href = '/dashboard/login/'; }

function doLogout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    window.location.href = '/dashboard/login/';
}

async function loadReport() {
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;
    const errorMsg = document.getElementById('errorMsg');

    if (!dateFrom || !dateTo) {
        errorMsg.style.display = 'block';
        return;
    }
    errorMsg.style.display = 'none';

    try {
        const res = await fetch(`/api/reports/sales-summary/?date_from=${dateFrom}&date_to=${dateTo}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        document.getElementById('totalUnits').innerText = data.total_units_sold ?? '—';
        document.getElementById('totalRevenue').innerText = 'Rs ' + Number(data.total_sales_revenue ?? 0).toLocaleString();
        document.getElementById('bestProduct').innerText = data.best_selling_product ?? '—';
        document.getElementById('worstProduct').innerText = data.worst_selling_product ?? '—';

        document.getElementById('summarySection').style.display = 'flex';
        document.getElementById('tableSection').style.display = 'block';

        const tbody = document.getElementById('topProductsBody');
        if (data.top_products && data.top_products.length > 0) {
            tbody.innerHTML = data.top_products.map((p, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td>${p.product_name}</td>
                    <td>${p.units_sold}</td>
                    <td>Rs ${Number(p.revenue).toLocaleString()}</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No data found for this period.</td></tr>';
        }

    } catch(e) {
        alert('Error loading report. Please try again.');
    }
}
</script>
</body>
</html>
